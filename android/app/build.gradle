plugins { id 'com.android.application' }

android {
    namespace 'com.imeilens.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imeilens.scanner'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.9.4'
        // Real phones only: drops the emulator-only x86 libraries to shrink the APK.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            // Set IMEI_KEYSTORE, IMEI_KEYSTORE_PASSWORD, IMEI_KEY_ALIAS, IMEI_KEY_PASSWORD to sign a release build.
            def keystore = System.getenv('IMEI_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('IMEI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IMEI_KEY_ALIAS')
                keyPassword System.getenv('IMEI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('IMEI_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    lint { abortOnError false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
