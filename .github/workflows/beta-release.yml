name: Beta APK pre-release

# Publishes a BETA pre-release (never "Latest") with the isolated-id test APK, built from the tagged commit.
# Trigger: push a tag named beta-v* (for example beta-v1.26.0-b1). The android-v* tags (production flow) are not touched.
on:
  push:
    tags: ['beta-v*']

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - name: Build the isolated-id APK (own app id, minified code, debug-signed)
        run: |
          gradle --project-dir android :app:assembleDebug -PphoneTest -PminifyDebug --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk"
          (cd out && sha256sum "IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk" > "IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk.sha256")
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## BETA: RetailLens Test (Scan. Sell. Track. Achieve.)
          **This is a beta test build, not a production release.**

          ### Install
          1. On the phone, download the **.apk** file from the assets below and open it (allow installing from this source when asked).
          2. It installs as **RetailLens Test**, next to your current IMEI Lens, with its own data. It does **not** replace or touch your existing app, records or photos.

          ### What is new
          - **A new, simpler layout.** The bottom bar is **Home, Scan, Phones, Report, Targets, Export**. People, Gives, Segments, Catalog, Share and Backup are under the **⋯** button at the top. Every screen has its own title (no more repeated "Scanned records" card).
          - **Phones:** a short list. Each phone shows its model and IMEI; tap it to open colour, RAM, IMEI 2, segment, stock status and the edit fields. Tick boxes and the action bar only appear after **Select**. "New scans go to" is now on the Scan screen.
          - **Home:** pick a person, and "Sell first for <name>" shows whose targets they are.
          - **Report:** paste your WhatsApp report; it is checked against your scanned phones (lines with no stock are counted as "no stock", not as matching). **Segments:** your own (Fold 1…). **Targets:** tap a level 70 to 120 for the pieces still needed. **Gives:** suggestions only.
          - Earlier in RetailLens: automatic retry of unread photos, bulk photo editor, People tab, WhatsApp report text share.

          ### Known limits
          - Debug-signed test build. Tested on the emulator and in automated tests; **not yet verified on a real phone**. Some emulator flows were unstable because the emulator itself was slow.
          - Not tested with your real report or a real Promoter screenshot (colour abbreviations are matched by a rule; if one does not match, the line says so and you fix it). The Promoter screenshot import still reads the old segment names and asks you to choose your segment per line.
          - The WhatsApp media-folder watcher is not built (shared photos work). Glare and blur retake guidance is not included yet.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/*.sha256 \
            --title "RetailLens BETA ${GITHUB_REF_NAME#beta-v}" \
            --prerelease --latest=false \
            --notes-file notes.md
