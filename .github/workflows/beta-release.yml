name: Beta APK pre-release

# Publishes a BETA pre-release (never "Latest") with the isolated-id test APK, built from the tagged commit.
# Trigger: push a tag named beta-v* (for example beta-v1.26.0-b1). The android-v* tags (production flow) are not touched.
on:
  push:
    tags: ['beta-v*']

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - name: Build the isolated-id APK (own app id, minified code, debug-signed)
        run: |
          gradle --project-dir android :app:assembleDebug -PphoneTest -PminifyDebug --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk"
          (cd out && sha256sum "IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk" > "IMEI-Lens-Beta-${GITHUB_REF_NAME}.apk.sha256")
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## BETA: RetailLens Test (Scan. Sell. Track. Achieve.)
          **This is a beta test build, not a production release.**

          ### Install
          1. On the phone, download the **.apk** file from the assets below and open it (allow installing from this source when asked).
          2. It installs as **RetailLens Test**, next to your current IMEI Lens, with its own data. It does **not** replace or touch your existing app, records or photos.

          ### What is new
          - **RetailLens** (IMEI Lens stays the scanning engine). The **Retail** tab (Detailed mode) has Today, Catalog, Targets, Gives, Stock, Reports and Data, all offline. Phones are sorted into segments, targets come from Promoter screenshots, allocations are proposed and need your approval, stock follows confirmed sales, and your WhatsApp report format is learned and rewritten for you. Share a WhatsApp report as text to the app to open it in Reports.
          - **Automatic retry:** a photo a scan could not read is tried once more by itself. IMEI 1 can be recovered from the barcode under strict checks. Only what is still unread goes to Review, with the reason in words, and the scan report shows the counts.
          - **Photo editor:** Fix It is inside Crop / Edit Photo. Bulk Edit has Previous, Next, Delete and progress. Delete removes a photo from the app only, never from the phone gallery.
          - **People tab** (add, edit, delete, search, devices, counts, export). The Unknown tab is replaced by a filter and badge.

          ### Known limits
          - Debug-signed test build. Tested on the emulator and in automated tests; **not yet verified on a real phone**. Some emulator flows were unstable because the emulator itself was slow.
          - Not tested with real Promoter screenshots or real WhatsApp reports. The incentive rates are examples: set your own.
          - The WhatsApp media-folder watcher is not built (shared photos work). Glare and blur retake guidance is not included yet.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/*.sha256 \
            --title "RetailLens BETA ${GITHUB_REF_NAME#beta-v}" \
            --prerelease --latest=false \
            --notes-file notes.md
