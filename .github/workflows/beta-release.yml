name: Beta APK pre-release

# Two separate publish paths. They never mix, and a test APK can never be published as the main app.
#
#   beta-vX.Y.Z-bN      the MAIN app (com.imeilens.scanner): the same build as the local one, signed with the project's permanent key, which
#                       comes from GitHub secrets. It is only published if the release gate passes (package id, version, app label and
#                       signing certificate), because an APK signed with any other key cannot update the installed app without
#                       uninstalling it, which loses its records. Published as a PRE-release, never "Latest".
#   betatest-vX.Y.Z-bN  the ISOLATED TEST app (com.imeilens.scanner.phonetest): its own app id and data, installs next to the main app
#                       and never replaces it. Debug-signed with a throwaway key, which is fine for a test app. Pre-release, never "Latest".
#
# Setup for the main app (once, in the repository settings, see DEVELOPERS.md "Publishing the main app"):
#   secrets   IMEI_KEYSTORE_B64, IMEI_KEYSTORE_PASSWORD, IMEI_KEY_ALIAS, IMEI_KEY_PASSWORD   (the signing key; never printed, never in the repo)
#   variable  EXPECTED_APK_CERT_SHA256   (the PUBLIC fingerprint of the key the installed app was signed with)
# The android-v* tags (production flow in android.yml) are not touched.
on:
  push:
    tags: ['beta-v*', 'betatest-v*']

permissions:
  contents: write

jobs:
  main:
    if: startsWith(github.ref_name, 'beta-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check the signing setup before building anything
        env:
          IMEI_KEYSTORE_B64: ${{ secrets.IMEI_KEYSTORE_B64 }}
          IMEI_KEYSTORE_PASSWORD: ${{ secrets.IMEI_KEYSTORE_PASSWORD }}
          IMEI_KEY_ALIAS: ${{ secrets.IMEI_KEY_ALIAS }}
          IMEI_KEY_PASSWORD: ${{ secrets.IMEI_KEY_PASSWORD }}
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          missing=""
          for name in IMEI_KEYSTORE_B64 IMEI_KEYSTORE_PASSWORD IMEI_KEY_ALIAS IMEI_KEY_PASSWORD EXPECTED_APK_CERT_SHA256; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Main APK not published::Missing setup:$missing. An APK signed with a key GitHub invents cannot update the installed app (the person would have to uninstall it and lose the records), so nothing is published. See DEVELOPERS.md, Publishing the main app."
            exit 1
          fi
          echo "Signing secrets and the expected certificate are set (values are not shown)."
      - name: The tag must match the app version in android/app/build.gradle
        run: |
          version="${GITHUB_REF_NAME#beta-v}"
          app=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          code=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" android/app/build.gradle | head -1)
          echo "tag version: $version, app version: $app (code $code)"
          if [ -z "$app" ]; then echo "::error::Could not read versionName from android/app/build.gradle"; exit 1; fi
          case "$version" in
            "$app"|"$app"-*) ;;
            *) echo "::error title=Tag does not match the app version::The tag says $version but the app is $app. Fix the tag or the version."; exit 1 ;;
          esac
      - run: npm ci && npm run build
      - run: node scripts/copy-android-assets.mjs
      - name: Build the main APK (the normal build, signed with the permanent key)
        env:
          IMEI_KEYSTORE_B64: ${{ secrets.IMEI_KEYSTORE_B64 }}
          IMEI_KEYSTORE_PASSWORD: ${{ secrets.IMEI_KEYSTORE_PASSWORD }}
          IMEI_KEY_ALIAS: ${{ secrets.IMEI_KEY_ALIAS }}
          IMEI_KEY_PASSWORD: ${{ secrets.IMEI_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/signing-key.jks"
          trap 'rm -f "$key"' EXIT   # the key file is removed even if the build fails
          printf '%s' "$IMEI_KEYSTORE_B64" | base64 -d > "$key"
          chmod 600 "$key"
          export IMEI_KEYSTORE="$key"
          gradle --project-dir android :app:assembleDebug -PsignDebugWithEnv --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/AI-LENS-${GITHUB_REF_NAME#beta-v}.apk"
      - name: Release gate (package id, version, app label, signing certificate)
        env:
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: node scripts/verify-apk.mjs --apk "out/AI-LENS-${GITHUB_REF_NAME#beta-v}.apk" --kind main
      - name: Checksum
        run: cd out && sha256sum "AI-LENS-${GITHUB_REF_NAME#beta-v}.apk" > "AI-LENS-${GITHUB_REF_NAME#beta-v}.apk.sha256"
      - name: Publish the pre-release (main app)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_APK_CERT_SHA256: ${{ vars.EXPECTED_APK_CERT_SHA256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#beta-v}"
          {
            echo "## AI LENS ${VERSION} (beta): the main app"
            echo "**A beta pre-release of the main app (\`com.imeilens.scanner\`). It is not marked as the latest production release.**"
            echo
            echo "### Install or update"
            echo "1. On the phone, download **AI-LENS-${VERSION}.apk** from the assets below and open it (allow installing from this source when asked)."
            echo "2. It installs **over your current AI LENS app** as an update and keeps your records and photos, when the installed app was signed with the same key (see Signing)."
            echo "3. If Android says the app was not installed or mentions a conflicting signature, **do not uninstall it** (that deletes the records). Back up first, or send the exact message to the developer."
            echo
            echo "### Signing and checks"
            echo "- Signed with the project's permanent key. Certificate SHA-256: \`${EXPECTED_APK_CERT_SHA256}\`."
            echo "- Before publishing, an automatic gate checked the package id (\`com.imeilens.scanner\`), the version (${VERSION}), the app label and that the signing certificate is the expected one. The APK's own SHA-256 is in the \`.sha256\` file."
            echo "- The isolated test app is a separate download (tags \`betatest-v...\`). It installs next to this app and never replaces it."
            echo
            echo "### What changed"
            awk '/^## /{n++} n==1' CHANGELOG.md | head -80
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" "out/AI-LENS-${VERSION}.apk" "out/AI-LENS-${VERSION}.apk.sha256" \
            --title "AI LENS ${VERSION} (beta, main app)" \
            --prerelease --latest=false \
            --notes-file notes.md

  test:
    if: startsWith(github.ref_name, 'betatest-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: node scripts/copy-android-assets.mjs
      - name: Build the isolated-id APK (own app id, minified code, debug-signed)
        run: |
          gradle --project-dir android :app:assembleDebug -PphoneTest -PminifyDebug --stacktrace
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/AI-LENS-Test-${GITHUB_REF_NAME}.apk"
          (cd out && sha256sum "AI-LENS-Test-${GITHUB_REF_NAME}.apk" > "AI-LENS-Test-${GITHUB_REF_NAME}.apk.sha256")
      - name: Release gate (must be the isolated TEST app, labelled as a test, never the main app)
        run: node scripts/verify-apk.mjs --apk "out/AI-LENS-Test-${GITHUB_REF_NAME}.apk" --kind test
      - name: Publish the pre-release (isolated TEST app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## BETA: AI LENS Test (Scan. Sell. Track. Achieve.)
          **This is a beta test build, not a production release.**

          ### Install
          1. On the phone, download the **.apk** file from the assets below and open it (allow installing from this source when asked).
          2. It installs as **AI LENS Test**, next to your current app, with its own data. It does **not** replace or touch your existing app, records or photos.

          ### What is new
          - **Assistant:** a round button on every screen opens a small chat with suggestions from your history; replies are a headline and bullets; "What next?" buttons work; "change flagship 3 target to 12 and divide it to promoters" is understood (preview first). **Search bar** in the header to jump to any screen or setting.
          - **Reports from the assistant:** ask for an Excel, PowerPoint or simple-notes report (Home → Make a report), then download it or send it on WhatsApp; built from the app's own numbers, no IMEI numbers, nothing changed.
          - **People by chat:** add, rename, delete and list people ("add 3 people Asha, Bilal and Chen"); reviewed first, undoable; phones of a deleted person move to Unassigned. A command that cannot be done is no longer shown as waiting for review.
          - **Reject all waiting requests** button on Home > Assistant review.
          - **One person's target by chat:** "set Maya's Flagship 1 target to 12" (also "my" and "everyone's"); previewed, approved, Undo; sold numbers are never edited.
          - **Voice for the assistant:** Speak button in the chat; offline speech to text (Whisper tiny, English, one-time 43 MB download), transcript shown and editable before it runs; names matched to your people.
          - **WhatsApp reports by the assistant:** "prepare today's WhatsApp report" saves the daily report as a prepared message (never sent by the app); routines and Autopilot can prepare it daily and a notification opens WhatsApp with the text filled in; you press Send.
          - **Timed routines and Auto give:** "give phones by the limits every day at 9:00" saves a routine that runs by itself at that time only (skipped if more than 5 minutes late), with run history and Run now; an Android background helper keeps the app alive and wakes it at the due time. "auto give" runs the Give & share rules with per-person limits.
          - **AI assistant tasks and modes:** several steps in one message run as a task (Home → Tasks) with progress and Undo; Assistant / Copilot / Autopilot modes with permissions in Settings; handover summary.
          - **Annual leave from the Shift Calendar:** AL days in a roster show the calculated target effect and can be saved as leave (targets change only after the reviewed calculation). **Hide suggestions** switch in Settings and in the small chat.
          - **1.27.1 automation:** shared Automatic/Manual processing, edit-priority background crop checks, Home attention/assistant and today/coming-days suggestions, global target policy and IMEI calendar model quantities. Sale release and final WhatsApp Send still require review.
          - **Daily plans and Stored:** Home shows Release today / Not today, true stock and upcoming editable quantities. Auto recalculates proposals; it never confirms sales automatically.
          - **Saved work calendars and AL targets:** Off/annual leave skips automatic transfers; manual overrides warn and are recorded. Divisors and shares are editable. Store120 splits40 each; AL40/(30-5)*5=8 adjusts to32/44/44 while retaining store120.
          - **Reports, exports and help:** Partial release reporting, dated drafts with mismatch warnings, extended planning exports, and interactive safe demo tutorials from ? Help. Optional on-device AI is experimental and cannot approve releases.
          - **Shift schedules:** Reviewed file imports, editable codes/times, original-file viewing, day/week/month sharing and Home reminders; separate from planned IMEI releases.
          - **Tablets & accessories:** Separate Daily OSR, stock snapshot approval without double import, final report editing and WhatsApp chooser; connected to Home, Export, Backup and History.
          - **Recovery:** Resume remaining saved native scan work, automatic local diagnostics export and performance guidance. Package/signing are preserved for in-place updates; no uninstall is required for matching installed builds.
          - **Home:** a **Month outlook** (where the month ends at this pace, what to push and what to leave: a guess, not a promise).
          - **Give and share:** a **Suggest only / Auto give** switch (Auto gives waiting phones by itself, with History and Undo), and **Limits per person**: minimum and maximum phones a day, or leave a person out.
          - **Targets:** pace in whole numbers ("2 a day", "1 every 3 days") with the day 70%, 100% and 120% are reached at this month's pace; a **Highest level** per segment for segments that stop at 100%; **Edit all** (every person and segment on one screen); screenshots and pasted text find the person from the name or ID and never guess.
          - **Fixes:** the sales record is no longer cut at 5,000 sales; a phone of a model that is not in the report no longer makes a new report line when it comes back from Sold; colours taught for every model no longer override a model whose own colours already fit; Same as last month ignores levels-only lines; Start from last month skips deleted people; Held phones can be put back in stock.
          - **Give and share** is one section with three tabs.
          - **Unknown models** can be deleted; the Catalog segment menu works again.
          - **Scan settings simplified:** one speed (Standard); products per photo Auto or 1 to 6.
          - **Store for now:** new scans wait for a saved Use now / Store / Plan choice; Stored counts in real stock and is unsold until confirmed release.
          - **Colour check before Sold:** pick the colour in the prompt so the exact colour comes off the report.
          - **After sending:** "Mark them as Sold?" with what will change, and Undo.
          - **Targets:** sold today per person, and a copyable "pieces per day" summary.
          - **Back button** goes to the previous screen instead of leaving the app.
          - **Less typing for colours:** a built-in colour dictionary, one Colour names list for the whole report (name a short form once, every line is filled in), and tap suggestions in the popup.
          - **Levels and months:** Use suggested / Same as last month, and Start from last month for targets.
          - **Targets:** the Everyone view lists each person under every segment, with what they need and per day.
          - **People:** Send, Bluetooth / nearby and Numbers buttons for each person.
          - **Numbers follow the phones by themselves:** mark a phone **Sold** and the owner's **Sold** in Targets goes up, the report line's **Sold** goes up, and the report stock goes down. Mark it back to In stock and it all comes off again. **Given** only leaves the stock. Scanned phones go into the report by themselves, too.
          - **Typed numbers:** Target and Sold are typed or pasted (no − / + buttons). **Copy target to everyone** copies the target only, never Sold. Assign by model is typed too, with **Copy to everyone**.
          - **Report popup in the right place** (above the bottom bar), with Previous / Next, "How to fix this line", editable labels, **Match my scans**; Save line marks a line as checked.
          - **Home looks at everyone**, with who needs help; **+ Person** on Phones and Scan.
          - Earlier in this beta line: colour themes (Settings > Colour), Simple mode as Scan / Phones / Send, colours of each model, the sliding bottom bar and the More sheet.

          ### Known limits
          - Debug-signed test build. Tested in automated tests and a short check on the emulator; **not yet verified on a real phone**, and the full emulator suite has not passed on this build (the emulator itself was unhealthy). Some emulator flows were unstable because the emulator itself was slow.
          - Not tested with your real report or a real Promoter screenshot (colour abbreviations are matched by a rule; if one does not match, the line says so and you fix it). The Promoter screenshot import still reads the old segment names and asks you to choose your segment per line.
          - The WhatsApp media-folder watcher is not built (shared photos work). Glare and blur retake guidance is not included yet.
          NOTES
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/*.sha256 \
            --title "AI LENS Test BETA ${GITHUB_REF_NAME#betatest-v} (isolated test app, not the main app)" \
            --prerelease --latest=false \
            --notes-file notes.md
