name: Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - run: gradle --project-dir android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IMEI-Lens-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          # Release notes: the CHANGELOG section for this version, after the install steps.
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {p=1; next} /^## /{p=0} p' CHANGELOG.md > changes.md
          {
            echo "## Install"
            echo "1. On an Android 7+ phone, download **IMEI-Lens-Android.apk** from the assets below and open it (allow installing from this source when asked)."
            echo "2. To update, install it over the old app. If Android refuses (a different signature), **export your records first**, uninstall the old app, then install this one. Records live inside the app and are removed by uninstalling."
            echo "3. Open **Settings**: the last line shows the version (${VERSION}); the website shows the same one."
            echo
            echo "The file is debug-signed. Photos and IMEIs stay on the phone."
            echo
            echo "## What changed in ${VERSION}"
            if [ -s changes.md ]; then cat changes.md; else echo "See CHANGELOG.md."; fi
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "android/app/build/outputs/apk/debug/app-debug.apk#IMEI-Lens-Android.apk" \
            --title "IMEI Lens for Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file release-notes.md
