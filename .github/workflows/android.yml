name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - run: gradle --project-dir android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IMEI-Lens-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "android/app/build/outputs/apk/debug/app-debug.apk#IMEI-Lens-Android.apk" \
            --title "IMEI Lens for Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Phone-only background scanning preview. Install this APK on Android, select photos with Scan on this phone in the background, and use the notification or app to stop. Photos and IMEIs remain on the phone. This preview uses an automatically generated debug signing key, so a later APK may require uninstalling the old version first. Export important records before replacing the app."
