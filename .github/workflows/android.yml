name: Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - run: gradle --project-dir android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IMEI-Lens-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK download
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "android/app/build/outputs/apk/debug/app-debug.apk#IMEI-Lens-Android.apk" \
            --title "IMEI Lens for Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes "IMEI Lens for Android. Install on Android 7 or newer (the file is debug-signed). To update, install over the old app; if Android refuses, export your records first, uninstall the old app, then install this one. See CHANGELOG.md for what changed. The website and this app are the same build: Settings shows the same version."
