name: Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci && npm run build
      - run: mkdir -p android/app/src/main/assets && cp -R dist/. android/app/src/main/assets/
      - name: Build APK
        env:
          # Optional repository secrets. With all four set, the APK is signed with your permanent release key,
          # so every new version installs over the old one. Without them the build falls back to the debug key
          # (a fresh debug key on each run, so users may have to uninstall before updating).
          IMEI_KEYSTORE_B64: ${{ secrets.IMEI_KEYSTORE_B64 }}
          IMEI_KEYSTORE_PASSWORD: ${{ secrets.IMEI_KEYSTORE_PASSWORD }}
          IMEI_KEY_ALIAS: ${{ secrets.IMEI_KEY_ALIAS }}
          IMEI_KEY_PASSWORD: ${{ secrets.IMEI_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$IMEI_KEYSTORE_B64" ] && [ -n "$IMEI_KEYSTORE_PASSWORD" ] && [ -n "$IMEI_KEY_ALIAS" ] && [ -n "$IMEI_KEY_PASSWORD" ]; then
            echo "$IMEI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export IMEI_KEYSTORE="$RUNNER_TEMP/release.jks"
            gradle --project-dir android :app:assembleRelease --stacktrace
            cp android/app/build/outputs/apk/release/app-release.apk out/IMEI-Lens-Android.apk
            echo "APK_SIGNING=release" >> "$GITHUB_ENV"
          else
            gradle --project-dir android :app:assembleDebug --stacktrace
            cp android/app/build/outputs/apk/debug/app-debug.apk out/IMEI-Lens-Android.apk
            echo "APK_SIGNING=debug" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: IMEI-Lens-Android-APK
          path: out/IMEI-Lens-Android.apk
      - name: Publish direct APK download
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          # Release notes: the CHANGELOG section for this version, after the install steps.
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {p=1; next} /^## /{p=0} p' CHANGELOG.md > changes.md
          {
            echo "## Install"
            echo "1. On an Android 7+ phone, download **IMEI-Lens-Android.apk** from the assets below and open it (allow installing from this source when asked)."
            echo "2. To update, install it over the old app. If Android refuses (a different signature), **export your records first**, uninstall the old app, then install this one. Records live inside the app and are removed by uninstalling."
            echo "3. Open **Settings**: the last line shows the version (${VERSION}); the website shows the same one."
            echo
            if [ "$APK_SIGNING" = "release" ]; then
              echo "The file is signed with the release key, so it installs over earlier versions signed with the same key. Photos and IMEIs stay on the phone."
            else
              echo "The file is debug-signed. Photos and IMEIs stay on the phone."
            fi
            echo
            echo "## What changed in ${VERSION}"
            if [ -s changes.md ]; then cat changes.md; else echo "See CHANGELOG.md."; fi
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "out/IMEI-Lens-Android.apk#IMEI-Lens-Android.apk" \
            --title "IMEI Lens for Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file release-notes.md
